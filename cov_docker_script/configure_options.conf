# WanManager Configure Options
# Flags derived from the SCXER10 Yocto do_compile log (rdk-wanmanager v2.18.3)
# Cross-compile specific flags (-mcpu, -march, --sysroot, -Os, -pipe, -g, *-prefix-map) are intentionally omitted.
# -DINCLUDE_BREAKPAD is omitted because the breakpad headers are not available natively.

# ============================================================================
# NOTE: Pre-build setup commands are defined in component_config.json
# ============================================================================

# ============================================================================
# CPPFLAGS - Preprocessor flags (includes and defines)
# ============================================================================
[CPPFLAGS]
# Autotools configuration
-DHAVE_CONFIG_H

# Include paths
-I$HOME/usr/include
-I$HOME/usr/include/rdkb/
-I$HOME/usr/include/rdkb/rbus
-I$HOME/usr/include/rdkb/ccsp
-I/usr/include/dbus-1.0
-I/usr/lib/x86_64-linux-gnu/dbus-1.0/include
-I$HOME/usr/dbus-dev/usr/include/dbus-1.0
-I$HOME/usr/dbus-dev/usr/lib/x86_64-linux-gnu/dbus-1.0/include
-I$HOME/usr/libcap-dev/usr/include

# Platform / product
-DSCXER10
-DSUPPORT_IPV6
-DBRCM_CMS_MSG
-D_RDKB_GLOBAL_PRODUCT_REQ_
-D_SCER11BEL_PRODUCT_REQ_
-D_SKY_HUB_COMMON_PRODUCT_REQ_
-D_XB6_PRODUCT_REQ_
-D_XB7_PRODUCT_REQ_
-D_XB8_PRODUCT_REQ_
-DCHIP_FAMILY_ID_HEX=0x6813
-D_COSA_BCM_ARM_
-D_COSA_INTEL_USG_ARM_
-D_COSA_FOR_COMCAST_
-D_COSA_HAL_
-D_ANSC_LINUX
-D_ANSC_USER
-D_ANSC_LITTLE_ENDIAN_
-D_ANSC_AES_USED_
-D_ANSC_USE_OPENSSL_
-D_NO_ANSC_ZLIB_
-D_NO_EXECINFO_H_
-D_NO_PKI_KB5_SUPPORT
-D_BBHM_SSE_FILE_IO
-D_CCSP_CWMP_TCP_CONNREQ_HANDLER
-D_DSLH_STUN_
-D_DEBUG
-DCCSP_SUPPORT_ENABLED
-DBUILD_WEB
-DGPIO_LED_MGR
-DNO_MOCA_FEATURE_SUPPORT
-DBRIDGE_MODE_NOT_SUPPORTED
-D_BRIDGE_UTILS_BIN_
-D_2_5G_ETHERNET_SUPPORT_
-DETH_5_PORTS
-DENABLE_ETH_WAN
-DDHCPV4_CLIENT_UDHCPC
-DDHCPV6_CLIENT_DIBBLER
-DUDHCPC_RUN_IN_BACKGROUND
-DUDHCPC_TX_RELEASE_ON_EXIT
-DNAT46_KERNEL_SUPPORT
-DNTPD_ENABLE
-DNTP_STATUS_SYNC_EVENT
-DUTC_ENABLE
-DXDNS_ENABLE
-DENABLE_SA_KEY
-D_MACSEC_SUPPORT_
-DUSE_NOTIFY_COMPONENT
-DENABLE_FEATURE_TELEMETRY2_0

# WAN manager features
-DFEATURE_RDKB_WAN_MANAGER
-DFEATURE_RDKB_CONFIGURABLE_WAN_INTERFACE
-DFEATURE_RDKB_DHCP_MANAGER
-DFEATURE_MAPT
-DFEATURE_MAPT_DEBUG
-DMAPT_UNIFICATION_ENABLED
-DWAN_MANAGER_UNIFICATION_ENABLED
-DWAN_FAILOVER_SUPPORTED
-DGATEWAY_FAILOVER_SUPPORTED
-DWAN_STATUS_LED_EVENT
-DFEATURE_IPOE_HEALTH_CHECK
-DFEATURE_802_1P_COS_MARKING
-DRBUS_BUILD_FLAG_ENABLE
-DRBUS_WAN_IP

# LED manager
-DFEATURE_RDKB_LED_MANAGER
-DFEATURE_RDKB_LED_MANAGER_CAPTIVE_PORTAL
-DFEATURE_RDKB_LED_MANAGER_FACTORY_RESET
-DFEATURE_RDKB_LED_MANAGER_LEGACY_WAN
-DFEATURE_RDKB_LED_MANAGER_PORT
-DFEATURE_RDKB_NO_WPS_BUTTON
-DFEATURE_RDKB_THERMAL_MANAGER

# Logging
-DFEATURE_SUPPORT_RDKLOG
-DFEATURE_SUPPORT_SYSLOG
-DFEATURE_SUPPORT_ONBOARD_LOGGING

# WiFi / mesh / misc features
-DRDK_ONEWIFI
-D_ENABLE_BAND_STEERING_
-D_BEACONRATE_SUPPORT
-D_TRI_BAND_WIFI_
-D_WIFI_AX_SUPPORT_
-DWIFI_HAL_VERSION_3
-DWIFI_CAPTIVE_PORTAL
-DWIFI_MANAGE_SUPPORTED
-DCONFIG_DFS
-DMESH_OVSAGENT_ENABLE
-DFEATURE_SUPPORT_MESH
-DFEATURE_SUPPORT_WEBCONFIG
-DFEATURE_SUPPORT_INTERWORKING
-DFEATURE_SUPPORT_PASSPOINT
-DFEATURE_SUPPORT_RADIUSGREYLIST
-DFEATURE_SUPPORT_ECOPOWERDOWN
-DFEATURE_CSI
-DFEATURE_OFF_CHANNEL_SCAN_5G
-D_PSM_TRANS_RDK_TRIGG_
-DFEATURE_FWUPGRADE_MANAGER
-DFEATURE_RDKB_INTER_DEVICE_MANAGER
-DSPEED_BOOST_SUPPORTED
-DAMENITIES_NETWORK_ENABLED

# ============================================================================
# CFLAGS - Compiler flags
# ============================================================================
[CFLAGS]
-fcommon
-fno-exceptions
-ffunction-sections
-fdata-sections
-fomit-frame-pointer
-fno-strict-aliasing

# ============================================================================
# LDFLAGS - Linker flags
# ============================================================================
[LDFLAGS]
-L$HOME/usr/lib
-L$HOME/usr/local/lib
-L$HOME/usr/local/lib/x86_64-linux-gnu
-L$HOME/usr/dummies
-L/usr/lib/x86_64-linux-gnu
-L$HOME/usr/dbus-dev/usr/lib/x86_64-linux-gnu
-Wl,-rpath,$HOME/usr/local/lib/x86_64-linux-gnu
-Wl,--allow-shlib-undefined
-Wl,--unresolved-symbols=ignore-all
-Wl,--no-as-needed
-Wl,-O1
-Wl,--hash-style=gnu

# ============================================================================
# LIBS - Libraries to link
# ============================================================================
[LIBS]
-lccsp_common
-lrdkloggers
-lhal_platform
-lapi_dhcpv4c
-lnanomsg
-lwebconfig_framework
-lmsgpackc
-lprivilege
-lrbus
-lsecure_wrapper
-lsyscfg
-lsysevent
-ltelemetry_msgsender
-lbreakpadwrapper
-lpthread
-lstdc++

# ============================================================================
# CONFIGURE - Arguments passed to ./configure
# ============================================================================
[CONFIGURE]
--enable-dhcp_manager
--enable-wanunificationsupport
